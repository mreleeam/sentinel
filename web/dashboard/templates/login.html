{% extends "base.html" %}

{% block title %}
Sentinel Login
{% endblock %}


{% block content %}

<main class="login-page">

  <section class="login-panel">

    <h1 class="terminal-title">
      SENTINEL
    </h1>

    <p class="login-subtitle">
      AUTHENTICATION REQUIRED
    </p>


    <form method="post">

      {% csrf_token %}


      {% if form.errors %}

      <p class="login-error">
        [!] INVALID CREDENTIALS
      </p>

      {% endif %}


      <div class="login-field">

        <label for="id_username">
          USERNAME
        </label>

        {{ form.username }}

      </div>


      <div class="login-field">

        <label for="id_password">
          PASSWORD
        </label>

        {{ form.password }}

      </div>


      <button type="submit" class="login-button">
        &gt; AUTHENTICATE
      </button>

    </form>

  </section>

</main>

{% endblock %}
